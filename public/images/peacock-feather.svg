<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 350" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="pfEyeGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFEB3B" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#4CAF50" stop-opacity="0.8" />
      <stop offset="65%" stop-color="#0288D1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1A237E" stop-opacity="0.95" />
    </radialGradient>
    <linearGradient id="pfStemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D" />
      <stop offset="60%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#795548" />
    </linearGradient>
  </defs>

  <!-- Golden Stem with elegant devotional curve -->
  <path d="M 100,340 C 95,250 85,160 100,30" stroke="url(#pfStemGrad)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Plumes and fine filigree strands -->
  <g stroke="#2E7D32" stroke-width="1.8" opacity="0.75" stroke-linecap="round">
    <path d="M 97,180 C 40,165 30,120 15,80" />
    <path d="M 103,180 C 160,165 170,120 185,80" />
    <path d="M 97,150 C 35,130 25,95 20,50" />
    <path d="M 103,150 C 165,130 175,95 180,50" />
    <path d="M 98,120 C 45,95 40,65 35,25" />
    <path d="M 102,120 C 155,95 160,65 165,25" />
    <path d="M 99,90 C 60,65 65,40 60,10" />
    <path d="M 101,90 C 140,65 135,40 140,10" />
  </g>

  <!-- Eye of Peacock Feather -->
  <g transform="translate(100, 65)">
    <ellipse cx="0" cy="0" rx="42" ry="52" fill="url(#pfEyeGlow)" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.15))"/>
    <ellipse cx="0" cy="0" rx="32" ry="40" fill="#FFA000" stroke="#FFE082" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="24" ry="30" fill="#00897B"/>
    <ellipse cx="0" cy="-2" rx="16" ry="20" fill="#1A237E"/>
    <ellipse cx="-4" cy="-7" rx="4" ry="6" fill="#FFFFFF" opacity="0.85"/>
  </g>
</svg>

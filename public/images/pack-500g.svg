<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <radialGradient id="p500Bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="80%" stop-color="#FAF0D8"/>
      <stop offset="100%" stop-color="#F2E4C4"/>
    </radialGradient>
    <linearGradient id="maroon500" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="50%" stop-color="#7A0715"/>
      <stop offset="100%" stop-color="#450A0A"/>
    </linearGradient>
    <linearGradient id="goldRib500" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CA8A04"/>
      <stop offset="50%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>
    <filter id="packShadow500">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#4A0E17" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="400" height="320" fill="url(#p500Bg)"/>
  <circle cx="200" cy="160" r="115" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.3" stroke-dasharray="4 4"/>

  <!-- Pack 500g Hexagonal / Premium Royal Gift Box -->
  <g filter="url(#packShadow500)">
    <ellipse cx="200" cy="265" rx="95" ry="20" fill="#5A2B18" opacity="0.25"/>

    <!-- Front & Side Faces -->
    <path d="M 115,140 L 200,170 L 285,140 L 285,235 L 200,265 L 115,235 Z" fill="url(#maroon500)" stroke="#D4AF37" stroke-width="2"/>
    <path d="M 115,140 L 200,105 L 285,140 L 200,170 Z" fill="#991B1B" stroke="#D4AF37" stroke-width="2"/>

    <!-- Inner face division -->
    <line x1="200" y1="170" x2="200" y2="265" stroke="#D4AF37" stroke-width="1.5"/>

    <!-- Golden Ribbon & Bow -->
    <path d="M 190,110 L 210,102 L 210,265 L 190,265 Z" fill="url(#goldRib500)" opacity="0.95"/>
    <circle cx="200" cy="140" r="14" fill="url(#goldRib500)" stroke="#FEF08A" stroke-width="1.5"/>
    <circle cx="200" cy="140" r="6" fill="#7A0715"/>

    <!-- Label Badges on Box Front -->
    <rect x="130" y="185" width="55" height="42" rx="4" fill="#FFFDF8" stroke="#D4AF37" stroke-width="1"/>
    <text x="157" y="202" font-family="serif" font-size="7" font-weight="bold" fill="#7A0715" text-anchor="middle">
      SHREE SHYAM
    </text>
    <text x="157" y="214" font-family="serif" font-size="6" fill="#B45309" text-anchor="middle">
      PRASAD
    </text>

    <!-- 500 g Golden Badge -->
    <circle cx="265" cy="130" r="22" fill="url(#goldRib500)" stroke="#FFF" stroke-width="1.5" filter="url(#packShadow500)"/>
    <text x="265" y="131" font-family="sans-serif" font-size="10" font-weight="bold" fill="#7A0715" text-anchor="middle">
      500g
    </text>
    <text x="265" y="141" font-family="sans-serif" font-size="7" font-weight="bold" fill="#7A0715" text-anchor="middle">
      PACK
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <radialGradient id="c2Bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="60%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </radialGradient>
    <radialGradient id="macroChurma" cx="45%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="90%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </radialGradient>
    <linearGradient id="gheeSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FBBF24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background Warm Canvas -->
  <rect width="500" height="400" fill="url(#c2Bg)"/>

  <!-- Macro Close-up Circle of Rich Churma Texture -->
  <g transform="translate(250, 180)">
    <!-- Ornate Frame -->
    <circle cx="0" cy="0" r="145" fill="#5A2B18" opacity="0.15"/>
    <circle cx="0" cy="0" r="138" fill="url(#macroChurma)" stroke="#D4AF37" stroke-width="4"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="#FFE082" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- Rich roasted crumbles & golden granules pattern -->
    <g fill="#FEF08A">
      <circle cx="-50" cy="-60" r="14"/><circle cx="20" cy="-70" r="18"/>
      <circle cx="70" cy="-30" r="16"/><circle cx="-80" cy="-10" r="20"/>
      <circle cx="-10" cy="-20" r="22"/><circle cx="40" cy="0" r="19"/>
      <circle cx="-60" cy="40" r="17"/><circle cx="10" cy="50" r="21"/>
      <circle cx="65" cy="45" r="15"/><circle cx="-20" cy="80" r="18"/>
    </g>

    <!-- Deep brown roasted crumbles for depth -->
    <g fill="#92400E" opacity="0.8">
      <circle cx="-35" cy="-45" r="8"/><circle cx="45" cy="-55" r="7"/>
      <circle cx="85" cy="-10" r="9"/><circle cx="-65" cy="15" r="8"/>
      <circle cx="15" cy="15" r="9"/><circle cx="-40" cy="65" r="8"/>
      <circle cx="35" cy="70" r="7"/><circle cx="0" cy="-60" r="6"/>
    </g>

    <!-- Golden Ghee Sheen Highlighting Texture -->
    <path d="M -80,-40 Q 0,-80 80,-40 Q 40,20 -80,-40 Z" fill="url(#gheeSheen)"/>

    <!-- Almond Silvers (Badaam) -->
    <g transform="rotate(-25 -30 -20)">
      <path d="M -45,-30 C -45,-45 -15,-45 -15,-30 C -15,-15 -45,-15 -45,-30 Z" fill="#FFFBEB" stroke="#B45309" stroke-width="1.2"/>
    </g>
    <g transform="rotate(35 40 30)">
      <path d="M 25,20 C 25,5 55,5 55,20 C 55,35 25,35 25,20 Z" fill="#FFFBEB" stroke="#B45309" stroke-width="1.2"/>
    </g>

    <!-- Green Pistachio (Pista) -->
    <ellipse cx="-20" cy="30" rx="8" ry="14" fill="#65A30D" stroke="#A3E635" stroke-width="1" transform="rotate(40 -20 30)"/>
    <ellipse cx="50" cy="-40" rx="7" ry="12" fill="#65A30D" stroke="#A3E635" stroke-width="1" transform="rotate(-15 50 -40)"/>

    <!-- Elaichi / Cardamom Pod and seeds -->
    <ellipse cx="-10" cy="-65" rx="6" ry="11" fill="#4D7C0F" stroke="#84CC16" stroke-width="1" transform="rotate(70 -10 -65)"/>
    <circle cx="10" cy="-62" r="2.5" fill="#1C1917"/>
    <circle cx="16" cy="-60" r="2" fill="#1C1917"/>
  </g>

  <!-- Title Badge overlay at bottom -->
  <rect x="125" y="345" width="250" height="36" rx="18" fill="#7A0715" stroke="#D4AF37" stroke-width="1.5"/>
  <text x="250" y="368" font-family="serif" font-size="15" font-weight="bold" fill="#FDE047" text-anchor="middle" letter-spacing="1">
    Rich Texture
  </text>
</svg>
